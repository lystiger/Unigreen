[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unigreen-backend"
version = "0.1.0"
description = "Uni-Green B2B sales platform backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "dramatiq[redis]>=1.17,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2.0,<5",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
unigreen-create-admin = "unigreen.staff.cli:main"
unigreen-import-catalogue = "unigreen.catalogue.importer:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unigreen"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=unigreen --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
