name: Infrastructure

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "contracts/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "contracts/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend worker storage-init web
      - run: docker compose up -d db redis
      - run: docker compose run --rm migrate
      - run: docker compose up -d backend
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend db redis
          exit 1
      - run: curl --fail --silent http://localhost:8000/health/live
      - if: always()
        run: docker compose down --volumes
